
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith TV Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600&family=Outfit:wght@100;300;500;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-glow: rgba(255, 255, 255, 0.3);
            --vignette-opacity: 0.4;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Outfit', sans-serif;
            color: white;
            cursor: none;
            transition: background-color 2s ease;
        }

        /* High-End Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Global Effects */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,var(--vignette-opacity)) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .text-glow {
            text-shadow: 0 0 50px var(--accent-glow);
        }

        .gradient-text {
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 1.5s ease;
        }

        /* Base Ambient Animation */
        @keyframes slow-pan {
            0% { transform: scale(1.1) translate(0, 0); }
            50% { transform: scale(1.15) translate(-1%, -1%); }
            100% { transform: scale(1.1) translate(0, 0); }
        }

        /* Theme-Specific Keyframes */
        @keyframes haze {
            0%, 100% { filter: brightness(1) contrast(1) blur(0px); }
            50% { filter: brightness(1.1) contrast(1.05) blur(1px); }
        }

        @keyframes ocean-sway {
            0%, 100% { transform: scale(1.1) rotate(0deg) translateY(0); }
            50% { transform: scale(1.12) rotate(1deg) translateY(-10px); }
        }

        @keyframes space-drift {
            0% { transform: scale(1.1) translate(0, 0); }
            100% { transform: scale(1.3) translate(-2%, -2%); }
        }

        @keyframes grid-pulse {
            0% { opacity: 0.2; transform: translateY(0); }
            50% { opacity: 0.5; transform: translateY(-10px); }
            100% { opacity: 0.2; transform: translateY(0); }
        }

        @keyframes flame-flicker {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Animation Classes */
        .animate-atmospheric { animation: slow-pan 40s ease-in-out infinite; }
        .animate-fireplace { animation: haze 8s ease-in-out infinite, slow-pan 30s ease-in-out infinite; }
        .animate-ocean { animation: ocean-sway 20s ease-in-out infinite; }
        .animate-space { animation: space-drift 60s linear infinite alternate; }
        .animate-futuristic { animation: slow-pan 40s ease-in-out infinite; }

        /* Overlays */
        .fireplace-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at bottom, rgba(255, 80, 0, 0.25) 0%, transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s;
            z-index: 2;
            animation: flame-flicker 4s ease-in-out infinite;
        }
        body.theme-fireplace .fireplace-overlay { opacity: 1; }

        .futuristic-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 242, 0.1) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(0, 255, 242, 0.1) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s;
            z-index: 2;
            mask-image: radial-gradient(circle, black 30%, transparent 80%);
        }
        body.theme-futuristic .futuristic-grid { opacity: 0.4; animation: grid-pulse 10s ease-in-out infinite; }

        /* Theme Classes */
        body.theme-futuristic { font-family: 'Space Grotesk', sans-serif; --accent-glow: rgba(0, 255, 242, 0.5); }
        body.theme-futuristic .gradient-text { background: linear-gradient(180deg, #00fff2 0%, #0066ff 100%); -webkit-background-clip: text; }
        
        body.theme-fireplace { --accent-glow: rgba(255, 120, 0, 0.5); }
        body.theme-fireplace .gradient-text { background: linear-gradient(180deg, #ffcc33 0%, #ff6600 100%); -webkit-background-clip: text; }

        body.theme-ocean { --accent-glow: rgba(0, 180, 255, 0.4); }
        body.theme-ocean .gradient-text { background: linear-gradient(180deg, #a0e9ff 0%, #0077ff 100%); -webkit-background-clip: text; }

        body.theme-space { --accent-glow: rgba(180, 100, 255, 0.4); }
        body.theme-space .gradient-text { background: linear-gradient(180deg, #e0c3fc 0%, #8e2de2 100%); -webkit-background-clip: text; }

        /* TV Safe Area */
        .tv-container {
            padding: 6vh 6vw;
        }

        .dim-mode {
            filter: brightness(0.3) contrast(1.1) saturate(0.8);
            transition: filter 10s ease-in-out;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
